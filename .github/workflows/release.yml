name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64

          - target: aarch64-unknown-linux-gnu
            arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Cross
        run: cargo install cross --locked

      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare Release
        run: |
          RELEASE_DIR="aether-linux-${{ matrix.arch }}"

          mkdir -p "$RELEASE_DIR/assets/linux"

          cp target/${{ matrix.target }}/release/aether \
             "$RELEASE_DIR/"

          cp target/${{ matrix.target }}/release/aetherd \
             "$RELEASE_DIR/"

          cp target/${{ matrix.target }}/release/aether-setup \
             "$RELEASE_DIR/"

          cp assets/linux/aetherd.service \
             "$RELEASE_DIR/assets/linux/"

      - name: Create Archive
        run: |
          tar -czf aether-linux-${{ matrix.arch }}.tar.gz \
              aether-linux-${{ matrix.arch }}

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aether-linux-x86_64.tar.gz
            aether-linux-aarch64.tar.gz
