name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare Release
        run: |
          mkdir -p aether-linux-x86_64/assets/linux

          cp target/x86_64-unknown-linux-gnu/release/aether \
             aether-linux-x86_64/

          cp target/x86_64-unknown-linux-gnu/release/aetherd \
             aether-linux-x86_64/

          cp target/x86_64-unknown-linux-gnu/release/aether-setup \
             aether-linux-x86_64/

          cp assets/linux/aetherd.service \
             aether-linux-x86_64/assets/linux/

      - name: Create Archive
        run: |
          tar -czf aether-linux-x86_64.tar.gz \
            aether-linux-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            aether-linux-x86_64.tar.gz
